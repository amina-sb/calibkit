[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "calibkit"
version = "0.1.0"
description = "Probability calibration for classifiers: ECE with justified binning, Brier decomposition, reliability diagrams and recalibrators."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Amina Salamatolla" }]
keywords = ["calibration", "machine-learning", "statistics", "brier-score", "ece"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = ["numpy>=1.23"]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
dev = [
    "pytest>=7.4",
    "hypothesis>=6.80",
    "scikit-learn>=1.2",
    "scipy>=1.10",
    "matplotlib>=3.6",
    "ruff>=0.4",
    "mypy>=1.8",
]

[project.scripts]
calibkit = "calibkit.cli:main"

[project.urls]
Repository = "https://github.com/amina-sb/calibkit"

[tool.hatch.build.targets.wheel]
packages = ["src/calibkit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]

[tool.ruff.lint.per-file-ignores]
# These write typographic dashes and multiplication signs into reports.
"scripts/evidence.py" = ["RUF001"]
"src/calibkit/cli.py" = ["RUF001"]

[tool.mypy]
strict = true
files = ["src", "tests", "scripts"]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["sklearn.*", "scipy.*", "matplotlib.*"]
ignore_missing_imports = true
